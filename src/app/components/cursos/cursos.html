<section id="cursos" class="bg-light py-5">
    <div class="container">
        <div class="text-center mb-4">
            <span class="eyebrow">Programas</span>
            <h2>Nuestros cursos</h2>
            <p class="text-muted">Filtra por idioma y encuentra tu nivel</p>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
            @for (filtro of filtros; track $index) {
            <button class="btn" [class.btn-primary]="idiomaActivo() === filtro"
                [class.btn-outline-primary]="idiomaActivo() !== filtro" (click)="filtrar(filtro)">
                {{filtro}}
            </button>
            }
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            @for (curso of listaCursos(); track curso.id) {
            <div class="col">
                <div class="card h-100 shadow-sm hover-card">
                    <div class="card-body d-flex flex-column">
                        <div class="mb-3">
                            <span class="badge bg-primary me-1">{{curso.idioma}}</span>
                            <span class="badge bg-warning text-dark">{{curso.nivel}}</span>
                        </div>
                        <h5 class="card-title">{{curso.nombre}}</h5>
                        <ul class="list-unstyled text-muted mb-3">
                            <li>🕒 {{curso.duracion}}</li>
                            <li>📍 {{curso.modalidad}}</li>
                        </ul>
                        <div class="mt-auto">
                            <span class="precio">S/ {{curso.precio}}</span>
                            <small class="text-muted"> / mes</small>
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
