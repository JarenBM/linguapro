<section id="promociones" class="seccion-oscura py-5">
    <div class="container">
        <div class="text-center mb-4">
            <span class="eyebrow eyebrow-claro">Ofertas vigentes</span>
            <h2>Promociones de temporada</h2>
        </div>
        <div class="row row-cols-1 row-cols-md-2 g-4">
            @for (promo of listaPromociones; track promo.id) {
            <div class="col">
                <div class="card h-100 shadow-sm hover-card">
                    <div class="card-body d-flex align-items-center flex-wrap gap-3">
                        <div class="descuento">-{{promo.descuento}}%</div>
                        <div class="flex-grow-1">
                            <h5 class="card-title">{{promo.titulo}}</h5>
                            <p class="text-muted mb-2">{{promo.descripcion}}</p>
                            <span class="badge bg-danger me-2">{{promo.vigencia}}</span>
                            <span class="codigo">{{promo.codigo}}</span>
                        </div>
                        <button class="btn btn-primary" (click)="usarPromocion(promo)">Usar promoción</button>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
